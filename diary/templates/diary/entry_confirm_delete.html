{% extends "base.html" %}

{% block title %}Удаление записи{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="alert alert-danger" role="alert">
            <h4 class="alert-heading">Внимание! Подтвердите удаление</h4>
            <p>Вы уверены, что хотите удалить запись <strong>"{{ object.title }}"</strong>?</p>
            <hr>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger me-2">
                    Да, удалить
                </button>
                <a href="{% url 'diary:entry_detail' pk=object.pk %}" class="btn btn-secondary">
                    Отмена
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
